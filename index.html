<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>첫 걸음 정책 노선도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 어두운 통로 → 질문마다 발자국이 하나씩 켜지고 끝의 빛이 커짐 → 도착하면 밝은 화면에서 정책 카드 5장.
   부스 아이패드(키오스크)와 QR로 연 개인 폰, 두 화면을 하나의 파일로. 의도적으로 한 가지 룩(밤의 통로 + 빛)으로 고정. */
:root{
  --night:#0B1020; --night2:#141B33; --mist:#8C95B5; --star:#EEF1FA;
  --light:#FFD98A; --light2:#FFF3D6;
  --day:#F5F6FA; --paper:#FFFFFF; --ink:#141824; --sub:#596079; --rule:#DFE2EC;
  --job:#3F6FF0; --biz:#F07A2E; --money:#17A06F; --rel:#D9468F;
  --ok:#17A06F; --warn:#B0761A; --warn-bg:#FDF2DC;
  --display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--star);font-family:var(--body);font-size:17px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
body.day{background:var(--day);color:var(--ink);color-scheme:light}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.28}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--light);outline-offset:3px}
.c-job{--c:var(--job)} .c-biz{--c:var(--biz)} .c-money{--c:var(--money)} .c-rel{--c:var(--rel)}

/* ── 통로 배경 ── */
.tunnel{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;--lit:0}
.tunnel .glow{position:absolute;left:50%;top:-30vh;width:calc(60vmax + 90vmax*var(--lit));height:calc(60vmax + 90vmax*var(--lit));transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,190,calc(.30 + .55*var(--lit))) 0%,rgba(255,217,138,calc(.12 + .25*var(--lit))) 28%,transparent 62%);transition:width .9s ease,height .9s ease,background .9s}
.tunnel .arch{position:absolute;left:50%;top:6vh;border:1.5px solid rgba(255,230,180,.13);border-bottom:0;border-radius:999px 999px 0 0;transform:translateX(-50%);transition:opacity .9s}
body.day .tunnel{display:none}

.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px 28px}
.wrap.wide{max-width:1180px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{background:none;border:0;padding:0;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.ghost{background:none;border:1px solid rgba(238,241,250,.25);border-radius:999px;padding:7px 16px;font-size:14px;color:var(--mist)}
.ghost:hover{color:var(--star);border-color:var(--star)}
body.day .ghost{border-color:var(--rule);color:var(--sub)}
body.day .ghost:hover{color:var(--ink);border-color:var(--ink)}

/* ── 인트로 ── */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:22px;padding-block:6vh}
.intro .eyebrow{font-size:14px;letter-spacing:.14em;color:var(--light);font-weight:600}
.intro h1{font-size:clamp(34px,7vw,64px);font-weight:900;letter-spacing:-.035em;max-width:13em}
.intro h1 em{font-style:normal;color:var(--light)}
.intro p{color:var(--mist);max-width:30em;margin:0;font-size:18px}
.steps-preview{display:flex;gap:14px;align-items:flex-end;margin-top:6px}
.steps-preview svg{width:22px;height:36px;fill:rgba(255,217,138,.25)}
.steps-preview svg:nth-child(odd){transform:translateY(-10px) scaleX(-1)}
.steps-preview svg.on{fill:var(--light);filter:drop-shadow(0 0 8px rgba(255,217,138,.8))}
.btn{border:0;border-radius:999px;padding:18px 34px;font-weight:600;font-size:19px;background:var(--light);color:#2A1E05;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 0 6px rgba(255,217,138,.14),0 10px 40px rgba(255,217,138,.25);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;box-shadow:none;cursor:not-allowed}
.btn.dark{background:var(--ink);color:#fff;box-shadow:none}
.btn.line{background:transparent;color:inherit;border:1.5px solid currentColor;box-shadow:none}
.link{background:none;border:0;color:var(--mist);text-decoration:underline;text-underline-offset:4px;font-size:15px}
body.day .link{color:var(--sub)}

/* ── 발자국 진행 ── */
.path{display:flex;align-items:center;gap:6px;margin:26px auto 0;max-width:100%}
.path .fp{width:18px;height:30px;fill:rgba(238,241,250,.14);transition:fill .5s,filter .5s,transform .5s;flex:none}
.path .fp.l{transform:translateY(-7px) scaleX(-1)}
.path .fp.r{transform:translateY(7px)}
.path .fp.done{fill:rgba(255,217,138,.75)}
.path .fp.now{fill:var(--light);filter:drop-shadow(0 0 10px rgba(255,217,138,.9))}
.path .sun{flex:none;width:30px;height:30px;border-radius:50%;margin-left:8px;background:radial-gradient(circle,var(--light2),var(--light) 45%,rgba(255,217,138,0) 72%);opacity:calc(.35 + .65*var(--lit))}
.stepcount{text-align:center;color:var(--mist);font-size:14px;margin-top:10px;font-variant-numeric:tabular-nums}
.stepcount b{color:var(--light);font-weight:600}

/* ── 질문 ── */
.q{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:28px 12px;width:100%;max-width:680px;margin:0 auto}
.q h2{font-size:clamp(26px,4.6vw,38px);font-weight:800;letter-spacing:-.025em;text-align:center}
.q .hint{color:var(--mist);text-align:center;margin:10px auto 28px;max-width:30em;font-size:16px}
.q h3.sub{font-size:18px;font-weight:700;margin:26px 0 12px;text-align:center}
.walk{animation:walk .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes walk{from{transform:translateY(26px) scale(.97);filter:blur(2px)}to{transform:none;filter:none}}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.four{grid-template-columns:repeat(4,1fr);gap:10px}
.opts.four .opt{justify-content:center;padding:16px 6px}
.opts.four .opt .box{display:none}
@media (max-width:520px){.opts.two{grid-template-columns:1fr}}
.opt{text-align:left;background:rgba(255,255,255,.04);border:1.5px solid rgba(238,241,250,.16);border-radius:18px;padding:17px 20px;display:flex;gap:14px;align-items:center;transition:border-color .2s,background .2s,box-shadow .2s;min-height:64px}
.opt:hover{border-color:rgba(238,241,250,.4)}
.opt[aria-pressed="true"]{border-color:var(--light);background:rgba(255,217,138,.1);box-shadow:0 0 24px rgba(255,217,138,.18)}
.opt .box{flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid rgba(238,241,250,.35);display:grid;place-items:center;font-size:14px;color:transparent}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"] .box{background:var(--light);border-color:var(--light);color:#2A1E05}
.opt b{display:block;font-weight:600;font-size:17.5px}
.opt small{display:block;color:var(--mist);font-size:14.5px;line-height:1.45;margin-top:2px}
.opt .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}

.age{display:grid;gap:22px;justify-items:center}
.age-row{display:flex;align-items:center;gap:26px}
.age-row button{width:64px;height:64px;border-radius:50%;border:1.5px solid rgba(238,241,250,.25);background:rgba(255,255,255,.05);font-size:30px;line-height:1}
.age-val{font-family:var(--display);font-weight:900;font-size:96px;line-height:1;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;color:var(--light);text-shadow:0 0 40px rgba(255,217,138,.45)}
.age-val small{font-size:26px;margin-left:4px;color:var(--star)}
.age input{width:min(100%,460px);accent-color:var(--light)}
.age .scale{width:min(100%,460px);display:flex;justify-content:space-between;font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}

.nav{display:flex;gap:12px;justify-content:center;align-items:center;padding-top:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .btn{min-width:220px}
.nav .back{background:none;border:0;color:var(--mist);font-size:16px;padding:14px}

/* ── 도착(결과) ── */
.arrive{position:relative;border-radius:28px;padding:34px 30px;background:radial-gradient(120% 140% at 50% -20%,var(--light2) 0%,#FFFFFF 55%);border:1px solid var(--rule);overflow:hidden;margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.arrive .eyebrow{font-size:14px;letter-spacing:.1em;color:var(--warn);font-weight:600}
.arrive h1{font-size:clamp(28px,4.4vw,44px);font-weight:900;letter-spacing:-.03em;margin-top:6px}
.arrive p{margin:10px 0 0;color:var(--sub);max-width:34em}
.me{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.me span{font-size:13.5px;background:var(--day);border:1px solid var(--rule);border-radius:999px;padding:4px 11px;color:var(--sub)}
.qr{display:grid;justify-items:center;gap:8px;text-align:center;background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:16px 16px 14px;width:214px}
.qr #qrbox{width:180px;height:180px;display:grid;place-items:center}
.qr #qrbox img,.qr #qrbox canvas,.qr #qrbox svg{width:180px!important;height:180px!important;image-rendering:pixelated}
.qr b{font-family:var(--display);font-size:15.5px}
.qr span{font-size:12.5px;color:var(--sub);line-height:1.45}
@media (max-width:700px){.arrive{grid-template-columns:1fr;padding:26px 20px}.qr{justify-self:center}}

.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 14px}
.secthead h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.secthead span{color:var(--sub);font-size:14px}

.deck{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,360px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 18px;align-items:start;scrollbar-width:thin}
.deck>*{scroll-snap-align:start}
@media (max-width:640px){.deck{grid-auto-flow:row;grid-auto-columns:auto;overflow:visible}.swipe{display:none}}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .head{padding:18px 20px 16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,#fff),#fff);border-bottom:1px solid var(--rule)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rank{font-family:var(--display);font-weight:900;font-size:30px;color:var(--c);line-height:1;font-variant-numeric:tabular-nums}
.cat{font-size:13px;font-weight:600;color:var(--c);display:flex;align-items:center;gap:6px}
.cat::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.badge{border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:600}
.badge.ok{background:color-mix(in srgb,var(--ok) 13%,#fff);color:var(--ok)}
.badge.check{background:var(--warn-bg);color:var(--warn)}
.card .lead{color:var(--sub);font-size:14.5px;margin:14px 0 0}
.card h3{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:2px;color:var(--ink)}
.card .tags{color:var(--c);font-size:13.5px;margin-top:6px}
.card .body{padding:16px 20px 18px;display:grid;gap:14px;font-size:15px;color:var(--ink)}
.card ul{margin:0;padding-left:1.1em;display:grid;gap:5px}
.why{display:flex;flex-wrap:wrap;gap:6px}
.why span{font-size:12.5px;background:var(--day);border-radius:6px;padding:3px 8px;color:var(--sub)}
.why span b{color:var(--ink);font-weight:600}
.warnbox{background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:14px}
.warnbox b{color:var(--warn)}
.card h4{margin:0 0 4px;font-size:12.5px;letter-spacing:.06em;color:var(--sub);font-weight:600}
.gloss{display:grid;gap:5px;font-size:13.5px;color:var(--sub)}
.gloss b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.more{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink)}
.go{display:inline-flex;align-items:center;gap:6px;background:var(--c);color:#fff;text-decoration:none;font-weight:600;border-radius:10px;padding:9px 14px;font-size:14px}

.others{display:grid;gap:8px}
.other{display:grid;grid-template-columns:10px 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.other i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.other b{display:block;font-weight:600}
.other span{display:block;font-size:13.5px;color:var(--sub)}
.other em{font-style:normal;font-size:13px;color:var(--sub)}
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.plat{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);display:grid;gap:4px;font-size:13.5px}
.plat b{font-family:var(--display);font-size:15.5px}
.plat span{color:var(--sub);line-height:1.5}
.endbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.foot{margin-top:26px;font-size:13px;color:var(--sub);border-top:1px solid var(--rule);padding-top:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px}
.filters button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.deck .rise:nth-child(2){animation-delay:.08s}.deck .rise:nth-child(3){animation-delay:.16s}.deck .rise:nth-child(4){animation-delay:.24s}.deck .rise:nth-child(5){animation-delay:.32s}
@keyframes rise{from{transform:translateY(22px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.walk,.rise{animation:none}.tunnel .glow{transition:none}}
</style>
</head>
<body>


<div class="tunnel" id="tunnel" aria-hidden="true"><div class="glow"></div></div>

<script>

o.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1490274"}, {"id": "money6", "cat": "money", "name": "청년전용 버팀목 전세자금 대출", "intro": "낮은 금리로 청년의 전세보증금을 빌려주는!", "tags": "#무주택청년 #최대1.5억원 #저금리전세대출", "detail": "• 지원자격: 19~34세 무주택 세대주·예비세대주, 소득·재산 등 기준 충족\n• 지원내용: 보증금의 최대 80%·기본 최대 1.5억 원, 기본금리 연 2.2~3.3%", "sum": "• 전세보증금을 낮은 이자로 빌릴 수 있어서, 전세 자금이 부족한 부부나 청년들에게 추천해요.\n• 부부합산 연소득 5천만원 이하, 순자산액 3.45억원 이하 무주택 세대주(예비세대주 포함) 신청 가능해요.\n• 대출기간은 2년이지만 최장 10년 이용 가능해요.", "link": "https://nhuf.molit.go.kr/FP/FP05/FP0502/FP05020301.jsp"}, {"id": "money7", "cat": "money", "name": "전세보증금반환보증 보증료 지원", "intro": "전세보증금반환보증 보증료를 돌려주는!", "tags": "#보증금지키기 #최대40만원 #보증료환급", "detail": "• 지원자격: 보증금 3억 원 이하 무주택 임차인, 반환보증 가입·소득 기준 충족\n• 지원내용: 이미 낸 반환보증 보증료 최대 40만 원 환급", "sum": "• 전세보증금을 돌려받도록 돕는 전세보증금반환보증(HUG·HF·SGI)에 가입할 때 낸 보증료를 돌려받을 수 있어요.\n• 무주택, 전세보증금 3억 이하, 연소득 5천만 이하·신혼부부 7500만 이하 최대 40만원까지 지원해요.\n• 정부24나 주민센터에서 연중 신청, 예산 소진시 조기 마감될 수 있으니 보증 가입 후 지원조건을 확인해 서둘러 신청해요.", "link": "https://www.gov.kr/portal/rcvfvrSvc/dtlEx/161300000103"}, {"id": "money8", "cat": "money", "name": "청년 월세 지원", "intro": "서울 청년의 월세를 매달 최대 20만 원 지원하는!", "tags": "#서울청년 #최대12개월 #생애1회", "detail": "• 지원자격: 서울 거주 19~39세 무주택 청년, 소득·재산·임차조건 충족\n• 지원내용: 실제 월세 중 월 최대 20만 원·최대 12개월, 생애 1회", "sum": "• 서울에 월세로 거주하는 청년의 월세를 최대 20만원씩, 최대 12개월까지 생애 1번만 지원해요. \n• 혼자 살거나 19세~39세인 형제자매·동거인과 함께 살아도, 다른 지원 조건에 맞으면 신청할 수 있어요.\n• 보증금 8천만원 이하 및 월세 60만원 이하 무주택자, 중위소득 48% 초과 ~ 150% 이하여야 해요.", "link": "https://housing.seoul.go.kr/site/main/content/sh01_060513#none"}, {"id": "money9", "cat": "money", "name": "국가장학금", "intro": "가구 형편에 따라 대학 등록금을 지원하는!", "tags": "#대학생 #등록금지원 #학기별신청", "detail": "• 지원자격: 국내 대학생 중 국적·소득·성적 등 기준 충족자\n• 지원내용: 등록금 범위 내 차등 지원, Ⅰ유형 기초·차상위 등록금 전액", "sum": "• 대학 등록금 부담을 줄여주는 장학금으로 대한민국 국적으로 국내 대학 재학생이라면 지원 가능해요.\n• 기초·차상위계층은 등록금 전액, 신입생 외에는 성적기준 충족자로 가구 형편에 따라 지원액이 달라요. \n• 학기마다 직접 신청하고, 필요한 서류와 가족의 정보제공 동의 완료 여부까지 확인해요.", "link": "https://www.kosaf.go.kr/ko/main.do"}, {"id": "money10", "cat": "money", "name": "학자금·생활비 대출 및 이자면제", "intro": "등록금·생활비를 빌리고 이자 부담도 덜어주는!", "tags": "#등록금대출 #생활비200만원 #이자면제", "detail": "• 지원자격: 대학생·대학원생 중 대출 종류별 자격 충족자\n• 지원내용: 등록금·생활비 대출, 생활비 학기당 최대 200만 원·조건별 이자면제", "sum": "• 등록금 대출 : 대학 등록금을 빌릴 수 있어요. 장학금과 달리 갚아야 하는 돈이예요. 일반상황은 약속한 일정에, 취업 후 상환은 소득이 기준을 넘는 등 상환 조건이 생기면 갚아요.\n• 생활비 대출 :  식비, 월세, 기숙사비, 교재비, 교통비 등에 쓸 돈을 학기당 최대 200만원까지 빌려 본인 계좌로 받아요. \n• 등록금·생활비 대출 상환 방식 : 일반상환은 정한 기간 동안 이자만 내다가 원금도 나눠 갚아요. 취업 후 상환은 취업 여부보다 소득이 기준을 넘는 등 상환 조건에 따라 갚아요.\n• 이자면제 : 취업 후 상환대출은 소득 등 조건에 맞으면 정해진 기간의 등록금·생활비 대출 이자를 면제해요. 이자가 면제돼도 원금은 갚아야 해요.", "link": "https://www.kosaf.go.kr/ko/main.do"}, {"id": "money11", "cat": "money", "name": "햇살론유스", "intro": "소득이 적은 청년에게 낮은 이자로 돈을 빌려주는!", "tags": "#취준생 #최대1200만원 #저금리대출", "detail": "• 지원자격: 19~34세·연소득 3,500만 원 이하 취업준비생·사회초년생 등\n• 지원내용: 생활비·취업준비비 등 총 최대 1,200만 원 대출·용도별 한도 적용", "sum": "• 소득이 적거나 없는 청년, 제도권 금융 이용이 어려운 대학(원)생, 취업준비생 대상 낮은 이자 대출이예요.\n• 19세~34세에 최대 1,200만원까지 나눠 빌릴 수 있어요. 300만원을 빌렸다 갚아도, 남은 총한도는 900만원이예요.\n• 서민금융진흥원 앱에서 보증 승인을 받은 뒤, 협약은행 앱에서 대출을 신청해요.", "link": "https://www.kinfa.or.kr/financialProduct/hessalLoanYoos.do"}, {"id": "money12", "cat": "money", "name": "청년 특례 채무 조정", "intro": "빚 갚기 어려운 청년이 다시 일어서도록 돕는!", "tags": "#90일이상연체 #분할상환 #상환유예", "detail": "• 지원자격: 90일 이상 연체한 대학(원)생 또는 34세 이하 미취업청년 등\n• 지원내용: 상환유예·분할상환, 심사에 따른 이자·원금 부담 완화", "sum": "• 90일 이상 대출금 연체 중인 만 19~34세 대학(원)생이나 미취업 청년들이 다시 일어설 수 있도록 도와줘요.\n• 모든 빚이 없어지는 것은 아니지만 빚을 나눠 갚거나 갚는 시기를 늦추고, 심사에 따라 이자·원금 부담을 줄여줘요.\n• 90일까지 연체를 기다리지 말고, 갚기 어렵다면 신용회복위원회에 상담 신청하면 든든한 도움을 받을 수 있어요.", "link": "https://www.ccrs.or.kr/cms/com/index.do?MENU_ID=1940"}, {"id": "rel1", "cat": "rel", "name": "청년문화예술패스", "intro": "19~20세 청년의 문화생활비를 지원하는!", "tags": "#공연전시영화도서 #최대20만원 #생애1회", "detail": "• 지원자격: 만 19~20세\n• 지원내용: 공연·전시·영화·도서 구입비 지원", "sum": "• 생애 한 번 문화생활비를 지원받을 수 있어요.\n• 수도권은 15만 원, 비수도권은 20만 원으로 지정된 온라인 구매처에서만 쓸 수 있어요.\n• 지역 예산이 소진되면 마감되니 연초에 서둘러 신청해야 해요.", "link": "https://youthculturepass.or.kr/kr/main.do"}, {"id": "rel2", "cat": "rel", "name": "청년마을 만들기 사업", "intro": "다른 지역에서 살아보며 일과 사람을 만나는!", "tags": "#지역살아보기 #일거리체험 #주민교류", "detail": "• 지원자격: 만 20~45세 등(프로그램별 모집 연령에 해당하는 청년)\n• 지원내용: 지역 살아보기·일거리 체험·청년 및 주민 교류 프로그램 지원", "sum": "• 다른 지역에서 살아보며 일거리를 체험하거나 자연을 즐기고 새로운 사람들과 교류해요.\n• 전국의 청년마을에서 청년사업가들이 소규모 프로그램을 진행해요.\n• 프로그램마다 참여 나이와 모집 일정이 다르니 청년마을 홈페이지에서 프로그램 공고를 수시로 확인해요.", "link": "https://localro.co.kr/"}, {"id": "rel3", "cat": "rel", "name": "청년인생설계학교", "intro": "막막한 진로와 삶의 방향을 함께 찾아주는!", "tags": "#자기이해 #진로설계 #대면그룹활동", "detail": "• 지원자격: 서울 거주 19~39세(스케치 코스 19~29세 비진학 청년/스타터 코스 18~24세)\n• 지원내용: 자기이해·진로설계 등을 위한 대면 프로그램 지원", "sum": "• 진로나 직장생활이 막막한 서울 청년이라면 앞으로의 방향을 함께 찾아갈 수 있어요.\n• 취준생·사회초년생·대학 비진학 등 상황에 맞춰 코스를 고르고, 대면 그룹활동(5회, 스타터 코스는 2회)에 참여해요.\n• 코스마다 참여 나이와 조건이 다르니 신청 전에 확인해요.", "link": "https://youth.seoul.go.kr/youthConts.do?key=2310200020&sc_pbancSeCd=013&sc_bbsStngSn=2212200001&sc_b"}, {"id": "rel4", "cat": "rel", "name": "고립·은둔청년 지원사업", "intro": "고립·은둔 청년의 일상 회복을 돕는!", "tags": "#맞춤형회복 #가족대리신청 #통합지원", "detail": "• 지원자격: 사회적 관계가 단절되거나 외부 활동이 제한된 19~34세\n• 지원내용: 초기 상담을 통한 맞춤형 프로그램(자기계발·건강관리·신체적/정신적 회복 등) 지원", "sum": "• 사람들과 물리적, 심리적으로 멀어져서 마음이 힘든 청년에게 맞춤형 회복 서비스를   지원해요.\n• 당사자 뿐만 아니라 부모 등 주변인을 돕고, 민관의 다양한 자원 연계까지 통합적으로 지원해요.\n• 혼자 신청하기 어렵다면 함께 사는 가족(8촌 이내의 혈족)이 대신 신청할 수 있어요.", "link": "https://youth.seoul.go.kr/youthConts.do?key=2310100062&sc_pbancSeCd=008&sc_bbsStngSn=2212200001&sc_bbsCtgrySn=2310200007&sc_faqCtgryCd=013"}, {"id": "rel5", "cat": "rel", "name": "시·군별 경기청년공간", "intro": "경기 청년이 쉬고 만나고 성장할 수 있는!", "tags": "#활동휴식공간 #취업창업상담 #문화프로그램", "detail": "• 지원자격: 경기도 거주 18~39세\n• 지원내용: 활동·휴식 공간 및 취업·창업·문화 프로그램 지원", "sum": "• 쉬거나 사람들을 만나고 싶을 때, 자기계발을 하고 싶을 때, 청년 공간을 이용할 수 있어요.\n• 공간에 따라 취업 상담부터 면접 정장 대여, 창업지원, 문화 프로그램까지 다양하게 지원받을 수 있어요.\n• 이용 나이·운영시간·프로그램이 공간마다 다르니, 방문 전에 확인해요.", "link": "https://youth.gg.go.kr/ggyouthplace/youth/place"}, {"id": "rel6", "cat": "rel", "name": "청년마음건강지원사업", "intro": "전문가와 1:1로 마음 이야기를 나누는!", "tags": "#1:1심리상담 #기본6회 #서울청년", "detail": "• 지원자격: 정서적 어려움을 겪는 서울 거주 만 29~39세(의무복무제대군인 연령 연장)\n• 지원내용: 전문가 1:1 맞춤형 심리상담 지원", "sum": "• 우울하거나 불안한 서울 청년이라면, 상담 선생님과 1:1로 마음 이야기를 나누는 맞춤형 상담을 기본 6회 받을 수 있어요.\n• 신청 기간이 짧고 일찍 마감될 수 있으니 빠르게 신청해요. \n• 선정된 후에는 정해진 기간 내에 심리검사 등 필수 절차를 반드시 완료해요.", "link": "https://youth.seoul.go.kr/youthConts.do?key=2310100076&sc_pbancSeCd=009&sc_bbsStngSn=2212200001&sc_bbsCtgrySn=2310200008&sc_qnaCtgryCd=&sc_faqCtgryCd=010&sc_hwStngSn=2501030001&sc_hwCtgrySn=0"}, {"id": "rel7", "cat": "rel", "name": "서울시 청년자율예산제", "intro": "청년이 직접 서울시 정책을 제안하는!", "tags": "#서울청정넷 #정책제안 #예산반영", "detail": "• 지원자격: 서울청년정책네트워크 위원(서울 거주 또는 서울 소재 대학·직장에 소속된 만 19~39세)\n• 지원내용: 서울시 정책 제안 기회 및 교육, 전문가 자문 지원", "sum": "• 서울청년정책네트워크(서울청정넷) 위원이 되면 서울시에 필요한 정책을 직접 제안할 수 있어요.\n• 제안서 작성 교육과 연구원 자문을 받으며 관심 있는 문제를 정책으로 구체화해요.\n• 제안한 사업은 심의와 시민 투표를 통해 100억 원 한도 안에서 예산에 반영돼요.", "link": "https://youth.seoul.go.kr/network/content.do?key=2309180006"}, {"id": "rel8", "cat": "rel", "name": "서울동아리ON(대학생동아리지원)", "intro": "대학생 동아리의 사회기여활동을 지원하는!", "tags": "#서울대학동아리 #최대200만원 #전문가컨설팅", "detail": "• 지원자격: 서울 소재 대학의 학부생 10명 이상 자치 동아리\n• 지원내용: 사회기여활동 경비 및 전문가 컨설팅 지원", "sum": "• 서울에 있는 대학교의 대학생 10명 이상이 모인 동아리라면, 사회에 도움이 되는 활동을 할 때 지원받을 수 있어요.\n• 동아리가 직접 활동을 계획하면 최대 200만 원을, 서울시가 준비한 프로그램에 참여하면 활동에 드는 비용을 지원받아요.\n• 이미 서울시나 구청 지원을 받는 동아리는 참여가 어려워요.", "link": "https://youth.seoul.go.kr/youthConts.do?key=2503190001&sc_detailAt=&pageIndex=1&orderBy=regYmd+desc&tabKind=201&sc_pbancSe=&sc_pbancSeCd=027&sc_bbsStngSn=2212200001&sc_bbsCtgrySn=2503180018&sc_pstSn=2604070004&sc_userId=&sc_ntcPstYn=&sc_delYn=&sc_ctgry=&useYn=&sc_faqCtgryCd=099&sc_qnaCtgryCd=&sc_plcyQnaSn=0&pstSn=&recordCountPerPage=10&sc_wDateS=&sc_wDateE=&sc=&sw="}], "G": [{"t": "구직단념청년", "full": "구직단념청년", "d": "일하고 싶은 마음은 있지만, 최근 6개월 넘게 취업·교육·훈련 없이 쉬고 있는 청년이에요."}, {"t": "참여수당", "full": "참여수당", "d": "프로그램에 참여하거나 끝까지 마치면 받는 돈이에요. 월급이 아니라 참여에 대한 보상이에요."}, {"t": "구직급여(실업급여)", "full": "구직급여(실업급여)", "d": "고용보험에 가입해 일하다가 원치 않게 일을 그만뒀을 때, 다시 일자리를 찾는 동안 받는 돈이에요."}, {"t": "구직촉진수당", "full": "구직촉진수당", "d": "국민취업지원제도 I유형 참여자가 구직활동을 하면 최대 6개월간 받는 생활비예요."}, {"t": "취업알선", "full": "취업알선", "d": "상담사가 나에게 맞는 회사를 찾아 연결해 주는 거예요."}, {"t": "근속", "full": "근속", "d": "한 회사에 계속 다니는 거예요. '3개월 근속'은 취업 후 3개월 이상 그만두지 않고 다녔다는 뜻이에요."}, {"t": "일경험", "full": "일경험", "d": "정식 취업 전에 기업에서 실제 업무를 해보는 거예요. 근로계약이 아닌 '연수' 형태인 경우가 많아요."}, {"t": "표준현장실습학기제", "full": "표준현장실습학기제", "d": "대학생이 한 학기 동안 기업에서 실습하고, 그걸 학점으로 인정받는 제도예요."}, {"t": "4대보험", "full": "4대보험", "d": "국민연금·건강보험·고용보험·산재보험을 합쳐 부르는 말이에요. 정식으로 고용되면 보통 함께 가입돼요."}, {"t": "주휴수당", "full": "주휴수당", "d": "일주일에 15시간 이상, 정해진 날을 빠짐없이 일하면 하루치 임금을 더 받는 거예요."}, {"t": "세전", "full": "세전", "d": "세금과 보험료를 떼기 전 금액이에요. 실제 통장에 들어오는 돈(세후)은 이보다 적어요."}, {"t": "생활임금", "full": "생활임금", "d": "최저임금보다 높게, 실제로 생활할 수 있는 수준으로 지자체가 정한 시급이에요."}, {"t": "근로계약", "full": "근로계약", "d": "회사와 임금·근무시간·기간 같은 일하는 조건을 약속하는 계약이에요. 이걸 맺어야 근로자로 보호받아요."}, {"t": "훈련장려금", "full": "훈련장려금", "d": "국민내일배움카드로 긴 훈련과정을 들으면서 출석을 잘하면 따로 받는 돈이에요."}, {"t": "해커톤", "full": "해커톤", "d": "개발자·디자이너·기획자가 팀을 짜서 1~2일 정도 짧은 시간 안에 아이디어를 실제 결과물로 만들어 겨루는 행사예요. 해킹(hack)과 마라톤(marathon)을 합친 말이에요."}, {"t": "IR", "full": "IR", "d": "투자자 앞에서 \"우리 회사는 이런 일을 하고, 앞으로 이만큼 성장할 거예요\"라고 소개하는 활동이에요. 쉽게 말해 투자를 받기 위한 회사 소개 발표예요."}, {"t": "시장 검증", "full": "시장 검증", "d": "내가 만든 제품이나 서비스를 진짜로 필요로 하는 사람이 있는지 확인하는 과정이에요. 실제로 돈 내고 쓸 사람이 있는지 직접 알아보는 거예요."}, {"t": "단순 상주", "full": "단순 상주", "d": "창업센터 같은 곳에 사무실 자리만 빌려서 들어가 있는 거예요. 교육이나 멘토링 같은 추가 도움 없이 공간만 쓰는 형태예요."}, {"t": "투자유치", "full": "투자유치", "d": "투자자에게 사업 자금을 받아 오는 거예요. 대신 보통 회사 지분(소유권) 일부를 투자자에게 나눠 줘요."}, {"t": "BM 검증", "full": "BM 검증", "d": "BM은 비즈니스 모델, 즉 \"이 사업으로 어떻게 돈을 벌 건지\"에 대한 계획이에요. 그 돈 버는 방식이 실제로 통하는지 확인해 보는 게 BM 검증이에요."}, {"t": "보육 연계형", "full": "보육 연계형", "d": "사무실 공간뿐 아니라 교육, 멘토링, 투자자 연결 같은 성장 프로그램까지 함께 지원받는 형태예요.\n아기를 돌보듯 회사가 자랄 수 있게 챙겨 준다고 해서 '보육'이라고 불러요."}, {"t": "딥테크", "full": "딥테크", "d": "AI, 반도체, 바이오, 로봇처럼 어려운 과학·공학 기술을 바탕으로 한 분야예요. 개발에 시간과 돈이 많이 들지만, 그만큼 다른 회사가 쉽게 따라 하기 어려워요."}, {"t": "시제품", "full": "시제품", "d": "정식으로 팔기 전에 \"이렇게 만들면 되겠다\"를 확인하려고 먼저 만들어 보는 샘플 제품이에요. '프로토타입'이라고도 해요."}, {"t": "기술보 function evaluate(pol,p){

  if(p.prio===pol.cat) score+=matched.length?4:1;

}

function loadQR(){
  if(qrReady) return qrReady;
  qrReady=new Promise(res=>{let i=0;const next=()=>{if(window.qrcode||window.QRCode) return res(true);if(i>=QR_SRC.length) return res(false);
    const s=document.createElement("script");s.src=QR_SRC[i++];s.onload=()=>(window.qrcode||window.QRCode)?res(true):next();s.onerror=next;document.head.appendChild(s)};next()});
  return qrReady;
}
async function drawQR(url){
  const box=document.getElementById("qrbox"); if(!box) return;
  const ok=await loadQR(); if(!document.body.contains(box)) return;
  try{
    if(window.qrcode){const q=qrcode(0,"M");q.addData(url);q.make();box.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});return}
    if(window.QRCode){box.innerHTML="";new QRCode(box,{text:url,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});return}
  }catch(e){}
  box.innerHTML=`<span style="font-size:11.5px;color:var(--sub);word-break:break-all;user-select:all">QR을 불러오지 못했어요. 이 주소로 열어 주세요.<br>${esc(url)}</span>`;
}

/* ───── 화면 ───── */
const app=document.getElementById("app"), tunnel=document.getElementById("tunnel");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bullets=t=>"<ul>"+t.split(/\n(?=\s*•)/).map(l=>`<li>${esc(l.replace(/^\s*•\s*/,"").replace(/\s*\n\s*/g," "))}</li>`).join("")+"</ul>";
function brand(){return `<button class="brand" onclick="home()" aria-label="처음으로"><svg viewBox="0 0 20 34" style="fill:var(--light)"><ellipse cx="10" cy="11" rx="7.2" ry="10"/><ellipse cx="10.6" cy="27.5" rx="5" ry="5.8"/></svg>첫 걸음 정책 노선도</button>`}

function buildArches(){
  let h="";for(let i=0;i<7;i++){const w=22+i*13, ht=30+i*14;h+=`<div class="arch" style="width:${w}vmax;height:${ht}vmax;opacity:${(1-i*0.12).toFixed(2)}"></div>`}
  tunnel.insertAdjacentHTML("beforeend",h);
}
function setLit(v){tunnel.style.setProperty("--lit",v);app.style.setProperty("--lit",v)}

function viewIntro(){
  setLit(.08);
  return `<div class="top">${brand()}<button class="ghost" onclick="go('browse')">전체 정책 보기</button></div>
  <section class="intro walk">
    <div class="eyebrow">서울여대 · 사회생활 첫 걸음 부스</div>
    <h1>한 걸음씩 걸어가면, <em>나에게 맞는 정책</em>이 보여요</h1>
    <p>10개의 짧은 질문에 답하면 조사한 청년정책 ${DATA.P.length}개 가운데 지금의 나에게 꼭 맞는 카드 5장을 골라 드려요. 결과는 QR로 내 폰에 가져갈 수 있어요.</p>
    <div class="steps-preview">${Array.from({length:7},(_,i)=>FOOT.replace('<svg',`<svg class="${i<1?"on":""}"`)).join("")}</div>
    <button class="btn" onclick="begin()">첫 걸음 떼기</button>
    <span style="color:var(--mist);font-size:14px">약 2분 · 입력한 정보는 저장되지 않아요</span>
  </section>`;
}

function opt(kind,key,val,label,small,on,extra=""){
  return `<button class="opt ${kind}" aria-pressed="${on}" onclick="pick('${key}','${val}')">${extra}<span class="box">✓</span><span><b>${label}</b>${small?`<small>${small}</small>`:""}</span></button>`;
}
function question(k){
  switch(k){
  case "age": return {t:"첫 걸음, 만 나이부터 알려주세요",h:"대부분의 청년정책은 만 나이로 대상을 정해요.",ok:true,
    b:`<div class="age"><div class="age-row"><button onclick="setAge(A.age-1)" aria-label="한 살 줄이기">−</button><div class="age-val" id="ageVal">${A.age}<small>세</small></div><button onclick="setAge(A.age+1)" aria-label="한 살 늘리기">+</button></div>
      <input id="ageRange" type="range" min="18" max="35" value="${A.age}" oninput="setAge(+this.value,true)" aria-label="만 나이"><div class="scale"><span>18</span><span>24</span><span>30</span><span>35</span></div></div>`};
  case "region": return {t:"주민등록상 주소는 어디인가요?",h:"지역 정책은 주소지를 기준으로 해요. 기숙사나 자취방이 서울이어도 주소를 옮기지 않았다면 원래 주소를 골라 주세요.",ok:!!A.region,
    b:`<div class="opts">${Q.region.map(([v,l])=>opt("radio","region",v,l,v==="etc"?"전국 단위 정책 위주로 찾아드려요":"",A.region===v)).join("")}</div>`};
  case "school": {const g=A.school==="univ"||A.school==="leave";return {t:"지금 학교생활은 어떤 상태예요?",h:"국가장학금, 내일배움카드처럼 학적과 학년에 따라 갈리는 정책이 있어요.",ok:!!A.school&&(!g||!!A.grade),
    b:`<div class="opts two">${Q.school.map(([v,l])=>opt("radio","school",v,l,"",A.school===v)).join("")}</div>
      ${g?`<h3 class="sub">몇 학년인가요?</h3><div class="opts four">${Q.grade.map(([v,l])=>opt("radio","grade",v,l,"",A.grade===v)).join("")}</div>`:""}`}}
  case "path": return {t:"졸업 후 어떤 길을 그리고 있나요?",h:"지금 가장 가까운 마음 하나를 골라 주세요.",ok:!!A.path,
    b:`<div class="opts">${Q.path.map(([v,l,s])=>opt("radio","path",v,l,s,A.path===v)).join("")}</div>`};
  case "stage": {const d=Q.stage[A.path];const own=A.stage==="own";return {t:d.t,h:d.h,ok:!!A.stage&&(!own||!!A.fy),
    b:`<div class="opts">${d.o.map(([v,l,s])=>opt("radio","stage",v,l,s,A.stage===v)).join("")}</div>
      ${own?`<h3 class="sub">창업한 지 얼마나 됐나요?</h3><div class="opts">${Q.fy.map(([v,l])=>opt("radio","fy",v,l,"",A.fy===v)).join("")}</div>`:""}`}}
  case "work": return {t:"요즘 일을 하고 있나요?",h:"알바 소득이 있으면 받을 수 있는 저축 정책이 있고, 정규직이면 미취업 청년 정책은 빠져요.",ok:!!A.work,
    b:`<div class="opts two">${Q.work.map(([v,l,s])=>opt("radio","work",v,l,s,A.work===v)).join("")}</div>`};
  case "house": {const ask=A.house==="parents"||A.house==="dorm";return {t:"지금 어디에서 지내고 있나요?",h:"월세·전세 지원은 사는 형태에 따라 달라요.",ok:!!A.house,
    b:`<div class="opts">${Q.house.map(([v,l])=>opt("radio","house",v,l,"",A.house===v)).join("")}</div>
      ${ask?`<h3 class="sub">한 걸음 더</h3><div class="opts">${opt("","indep","1","1~2년 안에 독립(자취)을 계획하고 있어요","전세대출 같은 정책을 미리 알아둘 수 있어요",A.indep)}</div>`:""}`}}
  case "money": return {t:"돈과 관련해 마음에 걸리는 게 있나요?",h:"해당하는 걸 모두 골라요. 부스에서 기록하지 않으니 편하게 골라도 돼요.",ok:A.money.size>0,
    b:`<div class="opts two">${Q.money.map(([v,l])=>opt("","money",v,l,"",A.money.has(v))).join("")}</div>`};
  case "mind": return {t:"요즘 마음의 컨디션은 어때요?",h:"마음을 돌보는 것도 사회생활의 첫 걸음이에요.",ok:A.cond!==null,
    b:`<div class="opts">${Q.cond.map(([v,l])=>opt("radio","cond",v,l,"",A.cond===v)).join("")}</div>
      <h3 class="sub">해보고 싶은 게 있다면 골라요 (선택)</h3><div class="opts two">${Q.wants.map(([v,l])=>opt("","wants",v,l,"",A.wants.has(v))).join("")}</div>`};
  case "priority": return {t:"마지막 한 걸음. 가장 먼저 풀고 싶은 고민은?",h:"고른 고민의 정책을 카드 맨 앞에 놓을게요.",ok:!!A.priority,
    b:`<div class="opts">${Q.priority.map(([v,l,c])=>`<button class="opt radio ${c}" aria-pressed="${A.priority===v}" onclick="pick('priority','${v}')"><span class="dot"></span><span><b>${l}</b></span></button>`).join("")}</div>`};
  }
}
function viewQuiz(){
  const steps=stepList(); if(S.i>=steps.length) S.i=steps.length-1;
  const k=steps[S.i], q=question(k), n=steps.length;
  setLit(.12+.7*(S.i/(n-1)));
  const path=steps.map((_,j)=>fp((j%2?"r":"l")+(j<S.i?" done":j===S.i?" now":""))).join("")+`<span class="sun"></span>`;
  const last=S.i===n-1;
  return `<div class="top">${brand()}<button class="ghost" onclick="home()">처음으로</button></div>
  <div class="path" aria-hidden="true">${path}</div>
  <div class="stepcount"><b>${S.i+1}번째 걸음</b> · 빛까지 ${n-S.i-1}걸음 남았어요</div>
  <section class="q walk" id="q" aria-live="polite"><h2>${q.t}</h2>${q.h?`<p class="hint">${q.h}</p>`:`<div style="height:24px"></div>`}${q.b}</section>
  <div class="nav"><button class="back" onclick="back()">← 이전</button><button class="btn" ${q.ok?"":"disabled"} onclick="next()">${last?"빛 속으로 나가기":"다음 걸음"} →</button></div>`;
}

function card(x,i){
  const {pol,st,note,why}=x, open=S.open.has(pol.id);
  const terms=DATA.G.filter(g=>g.t.length>1&&(pol.detail+pol.sum).includes(g.t)).slice(0,4);
  return `<article class="card c-${pol.cat} rise">
    <div class="head"><div class="row"><span class="rank">${i!=null?String(i+1).padStart(2,"0"):""}</span><span class="cat">${CATS[pol.cat].label}</span></div>
      <p class="lead">${esc(pol.intro)}</p><h3>${esc(pol.name)}</h3><div class="tags">${esc(pol.tags)}</div></div>
    <div class="body">
      ${st?`<div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap">${st===2?'<span class="badge ok">조건 충족 예상</span>':'<span class="badge check">조건 확인 필요</span>'}</div>`:""}
      ${why&&why.length?`<div class="why">${why.map(w=>`<span>${w}</span>`).join("")}</div>`:""}
      ${bullets(pol.sum)}
      ${note?`<div class="warnbox"><b>확인해요</b> · ${esc(note)}</div>`:""}
      ${open?`<div><h4>지원자격 및 지원내용</h4>${bullets(pol.detail)}</div>${terms.length?`<div><h4>용어 풀이</h4><div class="gloss">${terms.map(g=>`<div><b>${esc(g.full)}</b> — ${esc(g.d)}</div>`).join("")}</div></div>`:""}`:""}
      <div class="actions"><button class="more" aria-expanded="${open}" onclick="toggle('${pol.id}')">${open?"접기":"지원자격 보기"}</button>${pol.link?`<a class="go" href="${esc(pol.link)}" target="_blank" rel="noopener">신청 페이지 ↗</a>`:""}</div>
    </div></article>`;
}
function viewResult(){
  const {p,top,others}=results(); const [pt,pd]=persona(p);
  const chips=[`만 ${A.age}세`,REGIONS[A.region]+" 주소지",(Q.school.find(x=>x[0]===A.school)||[])[1]+(A.grade?` ${A.grade}학년`:""),(Q.path.find(x=>x[0]===A.path)||[])[1],(Q.house.find(x=>x[0]===A.house)||[])[1]].filter(Boolean);
  const url=SHARE_URL+"#"+encode();
  const plats=PLAT_RULES.filter(([n,f])=>f(p)).map(([n])=>DATA.L.find(l=>l.n.startsWith(n))).filter(Boolean);
  setTimeout(()=>drawQR(url),0);
  return `<div class="top">${brand()}${S.mode==="kiosk"?`<button class="ghost" onclick="home()">다음 사람 시작</button>`:`<button class="ghost" onclick="restartMine()">다시 해보기</button>`}</div>
  <section class="arrive rise">
    <div><div class="eyebrow">통로 끝에 도착했어요</div><h1>${pt}</h1>
      <p>${pd} 조건이 맞는 정책 ${top.length+others.length}개 중에서 지금 가장 필요한 ${top.length}개를 골랐어요.</p>
      <div class="me">${chips.map(c=>`<span>${esc(c)}</span>`).join("")}</div></div>
    ${S.mode==="kiosk"?`<div class="qr"><div id="qrbox"></div><b>내 폰으로 가져가기</b><span>카메라로 찍으면 이 카드 5장이 그대로 열려요</span></div>`:""}
  </section>
  <div class="secthead"><h2>나를 위한 정책 카드 ${top.length}장</h2><span class="swipe">${top.length>2?"옆으로 넘겨 보세요":""}</span></div>
  ${top.length?`<div class="deck">${top.map(card).join("")}</div>`:`<p class="foot">지금 조건에 꼭 맞는 정책을 찾지 못했어요. 아래 플랫폼에서 더 찾아볼 수 있어요.</p>`}
  ${others.length?`<div class="secthead"><h2>조건이 맞는 다른 정책</h2><span>${others.length}개</span></div>
    ${S.showOthers?`<div class="others">${others.map(x=>`<a class="other c-${x.pol.cat}" href="${esc(x.pol.link)}" target="_blank" rel="noopener"><i></i><span><b>${esc(x.pol.name)}</b><span>${esc(x.pol.intro)}</span></span><em>${x.st===2?"충족 예상":"확인 필요"} ↗</em></a>`).join("")}</div>`:""}
    <div style="text-align:center;margin-top:10px"><button class="link" onclick="S.showOthers=!S.showOthers;render(false)">${S.showOthers?"접기":"목록 펼쳐 보기"}</button></div>`:""}
  <div class="secthead"><h2>더 찾아볼 곳</h2><span>정책 플랫폼</span></div>
  <div class="plats">${plats.map(l=>`<a class="plat" href="${esc(l.u)}" target="_blank" rel="noopener"><b>${esc(l.n)} ↗</b><span>${esc(l.d.split("\n")[0])}</span></a>`).join("")}</div>
  ${S.mode==="kiosk"?`<div class="endbar"><button class="btn dark" onclick="home()">다음 사람 시작하기</button></div>`:""}
  <p class="foot">조건 판정은 청소년환경 수업 조사팀이 정리한 지원자격을 바탕으로 한 참고용이에요. 소득·재산 기준과 모집 기간은 정책마다 달라서, 신청 전에 공식 페이지에서 꼭 확인해요.</p>`;
}
function viewBrowse(){
  const shown=DATA.P.filter(x=>S.filter==="all"||x.cat===S.filter);
  const cnt=c=>DATA.P.filter(x=>x.cat===c).length;
  return `<div class="top">${brand()}<button class="ghost" onclick="home()">처음으로</button></div>
  <div class="secthead"><h2>전체 정책 ${DATA.P.length}개</h2><span>부스 상담용</span></div>
  <div class="filters">${["all",...Object.keys(CATS)].map(c=>`<button aria-pressed="${S.filter===c}" onclick="S.filter='${c}';render(false)" class="${c!=="all"?"c-"+c:""}">${c!=="all"?"<i></i>":""}${c==="all"?"전체":CATS[c].label} <span style="opacity:.6">${c==="all"?DATA.P.length:cnt(c)}</span></button>`).join("")}</div>
  <div class="grid">${shown.map(pol=>card({pol,st:0,why:[]},null)).join("")}</div>
  <div class="secthead"><h2>정책 플랫폼</h2><span>${DATA.L.length}곳</span></div>
  <div class="plats">${DATA.L.map(l=>`<a class="plat" href="${esc(l.u)}" target="_blank" rel="noopener"><b>${esc(l.n)} ↗</b><span>${esc(l.d.split("\n")[0])}</span></a>`).join("")}</div>`;
}

function render(scroll=true){
  const day=S.view==="result"||S.view==="browse";
  document.body.classList.toggle("day",day);
  app.classList.toggle("wide",day);
  app.innerHTML=S.view==="intro"?viewIntro():S.view==="quiz"?viewQuiz():S.view==="result"?viewResult():viewBrowse();
  if(scroll) window.scrollTo({top:0});
}
function keep(){const y=window.scrollY;render(false);window.scrollTo({top:y})}
function go(v){S.view=v;S.filter="all";S.open.clear();render()}
function home(){A=A0();S.i=0;S.showOthers=false;S.open.clear();S.mode="kiosk";try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}go("intro")}
function restartMine(){A=A0();S.i=0;S.open.clear();S.view="quiz";render()}
function begin(){A=A0();S.i=0;S.view="quiz";render()}
function next(){const n=stepList().length;if(S.i<n-1){S.i++;render()}else{S.view="result";S.open.clear();S.showOthers=false;render()}}
function back(){if(S.i>0){S.i--;render()}else home()}
function setAge(v,fromRange){A.age=Math.max(18,Math.min(35,v));document.getElementById("ageVal").innerHTML=`${A.age}<small>세</small>`;if(!fromRange)document.getElementById("ageRange").value=A.age}
function pick(key,val){
  if(key==="money"||key==="wants"){const s=A[key];
    if(val==="mnone"){A.money=new Set(s.has("mnone")?[]:["mnone"])}
    else{s.has(val)?s.delete(val):s.add(val);if(key==="money")s.delete("mnone")}}
  else if(key==="indep"){A.indep=!A.indep}
  else{A[key]=val;
    if(key==="school"&&!["univ","leave"].includes(val))A.grade=null;
    if(key==="path"){A.stage=null;A.fy=null}
    if(key==="stage"&&val!=="own")A.fy=null;
    if(key==="house"&&!["parents","dorm"].includes(val))A.indep=false}
  keep();
}
function toggle(id){S.open.has(id)?S.open.delete(id):S.open.add(id);keep()}

buildArches();
const h=(location.hash||"").slice(1);
if(h&&decode(h)){S.mode="mine";S.view="result";render()}else render();
</script>

</body>
